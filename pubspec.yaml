name: clockease
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Camera & Vision
  camera: 0.10.5+5
  google_mlkit_face_detection: ^0.13.1
  image: ^4.1.7

  # Firebase (all compatible with each other)
  firebase_core: ^3.6.0
  firebase_auth: ^5.7.0
  cloud_firestore: ^5.6.12
  firebase_storage: ^12.4.10   # <-- FIXED: compatible version

  # State management
  flutter_riverpod: ^2.5.1

  # Utilities
  cupertino_icons: ^1.0.8
  google_sign_in: ^7.0.0
  google_fonts: ^6.2.1
  intl: ^0.19.0
  path_provider: ^2.0.15
  geolocator: ^13.0.2      # GPS location tracking
  geocoding: ^3.0.0        # Reverse geocoding for addresses
  fl_chart: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/models/mobile_face_net.tflite
